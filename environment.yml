# Version: 1.11.0.dev17 (local/unreleased)
# Last updated: 2026-10-27
# Change history: CHANGELOG.md
name: vispa
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  - pip
  - setuptools>=68
  - wheel
  - tk
  - libblas=*=*openblas
  - libcblas=*=*openblas
  - liblapack=*=*openblas
  - numpy
  - matplotlib<3.11.1
  - pillow
  - pyyaml
  - scipy
  - scikit-image
  - nibabel
  - tifffile
  - imagecodecs
  - imageio
  - networkx
  - lazy_loader
  - trimesh=5.1.1
  - vispy=0.17.0
  - pyopengl=3.1.10
  - freetype-py
  - hsluv
  - pip:
      # Editable install creates the vispa console command from pyproject scripts.
      - "-e .[3d,tiff]"
