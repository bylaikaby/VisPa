# Version: 1.11.0.dev14 (local/unreleased)
# Last updated: 2026-10-26
# Change history: ../../CHANGELOG.md
name: Windows Conda Python-only check
on:
  push:
    branches: [main, simplified, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conda-python:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb  # v4.1.0
        with:
          activate-environment: vispa
          environment-file: environment.yml
          miniforge-version: 26.7.2-1
          channels: conda-forge,nodefaults
      - name: Install editable VisPa source directly
        shell: pwsh
        run: |
          python -m pip install --no-build-isolation -e ".[3d,tiff]"
          python -m pip check
      - name: Validate Windows installer
        shell: powershell
        run: .\tests\test_install.ps1
      - name: Verify command entry points and dry runs
        shell: pwsh
        run: |
          vispa --version
          python -m vispa --version
          vispa config-check --validate-only --config src/vispa/config_deb.yaml
          vispa example --dry-run --config src/vispa/config_deb.yaml
          vispa gui --dry-run --config src/vispa/config_deb.yaml --no-autoload
      - name: Run source tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s batch -p test_render_brain_views.py -v
