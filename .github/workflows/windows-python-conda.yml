# Version: 1.12.0.dev3 (local/unreleased)
# Last updated: 2026-10-31
# Change history: ../../CHANGELOG.md
name: Windows Conda Python-only check
on:
  push:
    branches: [main, simplified, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conda-python:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb  # v4.1.0
        with:
          activate-environment: vispa
          environment-file: environment.yml
          miniforge-version: 26.7.2-1
          channels: conda-forge,nodefaults
      - name: Verify integrated package dependencies
        shell: pwsh
        run: |
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Dependency check failed" }
          python -c "import numpy, pandas, nibabel, scipy, sklearn, openpyxl, matplotlib, seaborn; print('Shared analysis dependencies import successfully')"
          if ($LASTEXITCODE -ne 0) { throw "Shared dependency import failed" }
      - name: Verify script entry point and dry runs
        shell: pwsh
        run: |
          $fromModule = (python -m vispa --version | Out-String).Trim()
          $fromConsole = (vispa --version | Out-String).Trim()
          if ($fromModule -ne $fromConsole) { throw "CLI versions differ" }
          $repo = (Get-Location).Path
          Push-Location $env:TEMP
          vispa --help
          if ($LASTEXITCODE -ne 0) { throw "Console entry failed outside checkout" }
          Pop-Location
          python run_vispa.py --version
          python run_vispa.py config-check --validate-only --config src/vispa/configs/config_deb.yaml
          python run_vispa.py inputs --dry-run --config src/vispa/configs/config_deb.yaml --sample 251637 --neuron 004.swc
          python run_vispa.py example --dry-run --config src/vispa/configs/config_deb.yaml
          python run_vispa.py gui --dry-run --config src/vispa/configs/config_deb.yaml --no-autoload
      - name: Run source tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Source tests failed" }
          python -m unittest discover -s batch -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Batch tests failed" }
