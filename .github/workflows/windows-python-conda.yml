# Version: 1.11.0.dev17 (local/unreleased)
# Last updated: 2026-10-27
# Change history: ../../CHANGELOG.md
name: Windows Conda Python-only check
on:
  push:
    branches: [main, simplified, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conda-python:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb  # v4.1.0
        with:
          activate-environment: vispa
          environment-file: environment.yml
          miniforge-version: 26.7.2-1
          channels: conda-forge,nodefaults
      - name: Verify integrated package dependencies
        shell: pwsh
        run: python -m pip check
      - name: Verify script entry point and dry runs
        shell: pwsh
        run: |
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $fromModule = (python -m vispa --version | Out-String).Trim()
          $fromScript = (vispa --version | Out-String).Trim()
          if ($fromModule -ne $fromScript) { throw "vispa and python -m vispa versions differ: [$fromModule] [$fromScript]" }
          python -m vispa
          if ($LASTEXITCODE -ne 2) { throw "python -m vispa with no command exited $LASTEXITCODE" }
          $repo = (Get-Location).Path
          Push-Location $env:TEMP
          vispa --help
          if ($LASTEXITCODE -ne 0) { throw "vispa --help failed outside the checkout" }
          vispa config-check --validate-only --config (Join-Path $repo "src\vispa\config_deb.yaml")
          if ($LASTEXITCODE -ne 0) { throw "vispa config-check failed outside the checkout" }
          Pop-Location
          python run_vispa.py --version
          python run_vispa.py config-check --validate-only --config src/vispa/config_deb.yaml
          python run_vispa.py example --dry-run --config src/vispa/config_deb.yaml
          python run_vispa.py gui --dry-run --config src/vispa/config_deb.yaml --no-autoload
      - name: Run source tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s batch -p test_render_brain_views.py -v
