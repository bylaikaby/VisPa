# Version: 1.11.0.dev12 (local/unreleased)
# Last updated: 2026-10-25
# Change history: ../../CHANGELOG.md
name: Windows Conda Python-only check
on:
  push:
    branches: [main, simplified, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conda-python:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: vispa
          environment-file: environment.yml
          miniforge-version: latest
          channels: conda-forge,nodefaults
      - name: Verify command entry points and dry runs
        shell: pwsh
        run: |
          vispa --version
          python -m vispa --version
          vispa config-check --validate-only --config src/vispa/config_deb.yaml
          vispa example --dry-run --config src/vispa/config_deb.yaml
          vispa gui --dry-run --config src/vispa/config_deb.yaml --no-autoload
      - name: Run source tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
