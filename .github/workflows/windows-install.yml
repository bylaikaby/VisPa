# Version: 1.11.0.dev6 (local/unreleased)
# Last updated: 2026-10-23
# Change history: ../../CHANGELOG.md
name: Windows fresh install
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-install:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Anonymous source ZIP and Conda-first end-to-end install
        shell: pwsh
        run: |
          ./tools/windows_vm_e2e.ps1 -Commit $env:GITHUB_SHA -EvidenceDir (Join-Path $env:RUNNER_TEMP 'vispa-windows-e2e')
      - name: Upload Windows guest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-evidence
          path: |
            ${{ runner.temp }}/vispa-windows-e2e/run_receipt.json
            ${{ runner.temp }}/vispa-windows-e2e/public-example/*.png
            ${{ runner.temp }}/vispa-windows-e2e/public-example/*.json
            ${{ runner.temp }}/vispa-windows-e2e/opengl-context-render.png
          if-no-files-found: warn
