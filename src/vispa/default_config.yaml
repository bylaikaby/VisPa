# VisPa package defaults; public morphology example is available without lab paths.
# Version: 1.11.0.dev2 (local/unreleased) | Last updated: 2026-10-22
# Change history: ../../CHANGELOG.md
version: 1
base_dir: .
defaults:
  ds00_root: null
  resample_5um_root: null
  swc_cache_root: null
  swc_root: null
  cache_root: null
  output_root: null
samples: {}
visual_toolkit:
  output_root: null
  auto_reload: true
  worker_python: null
  default_sample: ''
  default_neuron: ''
  auto_load: false
  # Blank first-run workspaces offer the one-click public morphology example.
  # Existing/configured workflows stay selected by default in older configs.
  startup_mode: public-example
  # Optional: open the current neuron's FNT project from the GUI.
  # executable: absolute path to fnt-tracer.exe; project_root: folder holding
  # <sample>_<neuron>.fnt files (relative paths resolve against base_dir).
  fnt_tracer:
    executable: null
    project_root: null
  settings:
    review:
      marker.color: '#00e5ee'
      marker.min_px: 8.0
      marker.crosshair_px: 60.0
      marker.label_fontsize: 12
      marker.label_mode: none
      marker.label_offset_px: 22.0
      soma_window.cubes_xy: 1.5
      soma_window.cubes_xy_steps:
      - 1.5
      - 1.25
      - 1.0
      soma_window.max_cubes_xy: 3.0
      context.width_um: 8000
      context.height_um: 8000
      context.depth_um: 30
      context.swc_overlay_depth_um: 100.0
      widefield.gain: 2.0
      widefield.threshold: 100
      scale_bar_um.soma: 30.0
      scale_bar_um.context: 500.0
      scale_bar_um.sagittal: auto
      scale_bar_candidates_um:
      - 100.0
      - 200.0
      - 500.0
      - 1000.0
      - 2000.0
      - 5000.0
      - 10000.0
      - 20000.0
      - 50000.0
      figure.panel_figsize:
      - 12
      - 12
      figure.panel_dpi: 600
      figure.review_figsize:
      - 30
      - 11.6
      figure.review_dpi: 200
    brain-view:
      eye_direction:
      - -1.3
      - 1.6
      - 1.5
      up:
      - 0.0
      - 0.0
      - 1.0
      camera_distance_scale: 0.4
      line_width: 2.0
      soma_radius: 200.0
      background:
      - 0.0
      - 0.0
      - 0.0
      mesh_color:
      - 0.8
      - 0.8
      - 0.8
      neuron_color:
      - 1.0
      - 0.5
      - 0.0
      window_size:
      - 1100
      - 800
    montage:
      figure_size_inches:
      - 18.2
      - 4.4
      figure_dpi: 120
      max_dimension: 210
      otsu_sample_stride: 8
      otsu_clip_percentile: 99.5
      intensity_high_percentile: 99.3
      minimum_intensity_span: 1.0
      blur_sigma_voxels:
      - 0.45
      - 0.45
      - 0.95
      foreground_threshold: 0.08
      min_foreground_voxels: 1000
      max_foreground_points: 300000
      view_extent_percentiles:
      - 0.6
      - 99.4
      depth_percentiles:
      - 0.3
      - 99.7
      projection_padding_fraction: 0.07
      minimum_extent_mm: 5.0
      projection_bin_mm: 0.36
      horizontal_bins_px:
      - 150
      - 260
      vertical_bins_px:
      - 150
      - 280
      depth_step_mm: 0.55
      depth_bins:
      - 56
      - 110
      ray_extinction: 8.0
      layer_alpha_cap: 0.88
      normalization_percentile: 99.5
      display_gamma: 0.88
      background_cutoff: 0.012
      min_positive_pixels: 200
      min_filled_fraction: 0.04
      green_channel_scale: 0.985
      blue_channel_scale: 0.94
# Optional raw-SWC portal. When http_host and raw_swc_base are both set, a
# neuron missing from the local cache is fetched into legacy_raw_swc_root.
#   http_host: 'http://portal.example.org'
#   raw_swc_base: 'http://raw.example.org/swc/newswc'
sources: {}
