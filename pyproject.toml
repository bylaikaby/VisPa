[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vispa"
version = "1.11.0.dev3"
description = "VisPa — Visual Projectome Analysis tool for microscopy visualization and review"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib<3.11.1", "Pillow", "PyYAML"]

[project.optional-dependencies]
"3d" = [
    "freetype-py",
    "glfw==2.11.0",
    "hsluv",
    "imageio",
    "lazy_loader",
    "networkx",
    "nibabel",
    "PyGLM==2.8.3",
    "PyOpenGL==3.1.10",
    "scikit-image",
    "scipy",
    "tifffile",
    "trimesh==5.1.1",
    "vispy==0.17.0",
]

[project.scripts]
vispa = "vispa.cli:main"
visual-toolkit = "vispa.cli:main"

[project.gui-scripts]
vispa-gui = "vispa.gui:main"
visual-toolkit-gui = "vispa.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vispa = ["default_config.yaml"]

