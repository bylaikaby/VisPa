[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vispa"
version = "1.11.0.dev16"
description = "VisPa — Visual Projectome Analysis tool for microscopy visualization and review"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib<3.11.1", "Pillow", "PyYAML", "tifffile"]

[project.optional-dependencies]
tiff = ["tifffile", "imagecodecs"]
nifti = ["nibabel"]
ssh = ["paramiko"]
"3d" = [
    "freetype-py",
    "glfw==2.11.0",
    "hsluv",
    "imageio",
    "lazy_loader",
    "networkx",
    "nibabel",
    "PyGLM==2.8.3",
    "PyOpenGL==3.1.10",
    "scikit-image",
    "scipy",
    "trimesh==5.1.1",
    "vispy==0.17.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vispa = ["config_deb.yaml"]
